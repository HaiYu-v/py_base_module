[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "base_module"          # pip 安装时的包名
version = "1.0.0"
description = "基础的工具类"
authors = [
    {name = "胡亚北", email = "2239473866@q.com"}
]
readme = "README.md"
# 与 reader-work 各项目保持一致，本机为 3.13.2
requires-python = ">=3.13"

# 依赖
dependencies = [
    "requests>=2.32.5",
    "openpyxl>=3.1.5",
    "matplotlib>=3.7.5",
    "scipy>=1.10.1",
    "pydantic>=2.13.4",
    "sqlmodel>=0.0.48",
    "snowflake-id>=1.0.2",
]

# 只用于本地开发 / 测试，不随包安装
# 安装：uv sync        （含 dev 组）
#       uv sync --no-dev（只要运行时依赖）
[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["base_module*"]
